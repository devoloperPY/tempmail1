<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <title>Login Akun — Sigit TempMail</title>
  <link rel="icon" href="favicon.ico" />
  <script>
    window.turnstileToken = '';
    window.onloadTurnstileCallback = function () {
      const container = document.getElementById('turnstile-container');
      if (!container || typeof turnstile === 'undefined') {
        console.error('[Turnstile] Container atau SDK tidak ditemukan');
        return;
      }
      try {
        turnstile.render('#turnstile-container', {
          sitekey: '0x4AAAAAAAFXQbQssK5W-jNNf',
          theme: 'light',
          callback: function (token) {
            window.turnstileToken = token;
            const status = document.getElementById('turnstile-status');
            if (status) {
              status.textContent = 'Verifikasi berhasil';
              status.className = 'text-[11px] mt-1 text-emerald-600 font-medium text-center';
            }
          },
          'error-callback': function (errorCode) {
            console.error('[Turnstile] Error:', errorCode);
            window.turnstileToken = '';
            const status = document.getElementById('turnstile-status');
            if (status) {
              status.textContent = 'Verifikasi gagal. Refresh halaman.';
              status.className = 'text-[11px] mt-1 text-red-600 font-medium text-center';
            }
          },
          'expired-callback': function () {
            window.turnstileToken = '';
            const status = document.getElementById('turnstile-status');
            if (status) {
              status.textContent = 'Verifikasi kadaluarsa. Ulangi.';
              status.className = 'text-[11px] mt-1 text-amber-600 font-medium text-center';
            }
          }
        });
      } catch (e) {
        console.error('[Turnstile] Render error:', e.message);
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback" async defer></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="flex flex-col min-h-screen">
  <div class="bg-mesh">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <header class="glass-nav">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="login.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl btn-primary flex items-center justify-center text-white">
          <i data-lucide="mail-check" class="w-5 h-5"></i>
        </div>
        <span class="font-extrabold text-lg text-slate-900">Sigit<span class="text-blue-600">TempMail</span></span>
      </a>
      <a href="register.html" class="text-xs sm:text-sm font-semibold text-blue-600 hover:underline">
        Belum punya akun? Daftar &rarr;
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-md w-full space-y-6 animate-fade-in">
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-2 shadow-sm">
          <i data-lucide="log-in" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900">Selamat Datang Kembali</h1>
        <p class="text-xs sm:text-sm text-slate-500">Masuk ke dashboard untuk menikmati kuota email ekstra.</p>
      </div>

      <div id="auth-error-box" class="hidden p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium"></div>

      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label for="login-email" class="block text-xs font-semibold text-slate-700 mb-1.5">Alamat Email</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input
              type="email"
              id="login-email"
              required
              placeholder="nama@gmail.com"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/90 border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 text-sm outline-none transition"
            />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-xs font-semibold text-slate-700">Password</label>
            <a href="https://t.me/sigitchan" target="_blank" rel="noopener" class="text-xs text-blue-600 hover:underline">Lupa password?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input
              type="password"
              id="login-password"
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-10 py-3 rounded-xl bg-white/90 border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 text-sm outline-none transition"
            />
            <button type="button" id="toggle-login-pwd" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="flex flex-col items-center pt-1">
          <div id="turnstile-container" class="flex justify-center items-center min-h-[65px] w-[300px] max-w-full bg-slate-50/50 border border-slate-200/60 rounded-xl">
            <span class="text-xs text-slate-400">Memuat verifikasi...</span>
          </div>
          <p id="turnstile-status" class="text-[11px] mt-1 text-slate-400 text-center"></p>
        </div>

        <button type="submit" id="btn-login-submit" class="btn-primary w-full py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
          <span>Masuk ke Dashboard</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="pt-4 border-t border-slate-200/80 text-center text-xs text-slate-600">
        Belum punya akun? <a href="register.html" class="font-bold text-blue-600 hover:underline">Daftar Sekarang</a>
      </div>
    </div>
  </main>

  <script src="assets/utils.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
