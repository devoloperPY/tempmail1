<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Halaman Tidak Ditemukan</title>
<link rel="icon" href="favicon.ico" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: #f4f7fb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }
  .wrap {
    text-align: center;
    max-width: 400px;
  }
  .code {
    font-size: 96px;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.05em;
    line-height: 1;
    margin: 0;
  }
  .sub {
    font-size: 18px;
    font-weight: 600;
    color: #64748b;
    margin-top: 8px;
    margin-bottom: 28px;
  }
  .btn {
    display: inline-block;
    background: #1a73e8;
    color: #ffffff;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.15s ease;
    box-shadow: 0 4px 14px rgba(26, 115, 232, 0.35);
  }
  .btn:hover {
    background: #1557b0;
  }
  .footer {
    margin-top: 40px;
    font-size: 12px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <p class="sub">Not Found</p>
    <a href="/dashboard.html" class="btn" id="btn-back">Kembali ke Dashboard</a>
    <p class="footer">&copy; 2026 Sigit TempMail</p>
  </div>

  <script>
    (function () {
      var btn = document.getElementById('btn-back');
      if (!btn) return;

      var token = localStorage.getItem('session_token');
      var userRaw = localStorage.getItem('user_data');
      var role = null;

      try {
        if (userRaw) role = JSON.parse(userRaw).role;
      } catch (e) {}

      if (!token) {
        btn.href = 'login.html';
        btn.textContent = 'Kembali ke Login';
      } else if (role === 'admin' || role === 'owner') {
        btn.href = 'admin.html';
        btn.textContent = 'Kembali ke Admin';
      } else {
        btn.href = 'dashboard.html';
        btn.textContent = 'Kembali ke Dashboard';
      }
    })();
  </script>
</body>
</html>
