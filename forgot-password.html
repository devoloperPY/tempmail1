<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <title>Lupa Password — Sigit TempMail</title>
  <link rel="icon" href="favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="flex flex-col min-h-screen">
  <div class="bg-mesh">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <header class="glass-nav">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl btn-primary flex items-center justify-center text-white">
          <i data-lucide="mail-check" class="w-5 h-5"></i>
        </div>
        <span class="font-extrabold text-lg text-slate-900">Sigit<span class="text-blue-600">TempMail</span></span>
      </a>
      <a href="login.html" class="text-xs sm:text-sm font-semibold text-blue-600 hover:underline">
        Kembali ke Login
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-md w-full space-y-6 animate-fade-in bg-white/90">
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-2 shadow-sm">
          <i data-lucide="key-round" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900">Lupa Password?</h1>
        <p class="text-xs sm:text-sm text-slate-500">Masukkan email kamu, kami akan kirim kode reset.</p>
      </div>

      <div id="auth-error-box" class="hidden p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium"></div>
      <div id="auth-success-box" class="hidden p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium"></div>

      <form id="forgot-form" class="space-y-4" novalidate>
        <div>
          <label for="forgot-email" class="block text-xs font-semibold text-slate-700 mb-1.5">Alamat Email</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input
              type="email"
              id="forgot-email"
              required
              placeholder="nama@gmail.com"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-white border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 text-sm outline-none transition"
            />
          </div>
        </div>

        <div class="flex justify-center my-3">
          <div class="cf-turnstile"
               data-sitekey="0x4AAAAAAFY_Ai9UhXghURVa"
               data-theme="light"
               data-size="normal"
               data-appearance="always"
               data-callback="onTurnstileSuccess"
               data-error-callback="onTurnstileError"
               data-expired-callback="onTurnstileExpired">
          </div>
        </div>

        <button type="submit" id="btn-forgot-submit" class="btn-primary w-full py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
          <span>Kirim Kode Reset</span>
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="pt-4 border-t border-slate-200/80 text-center text-xs text-slate-600">
        Ingat password? <a href="login.html" class="font-bold text-blue-600 hover:underline">Login di sini</a>
      </div>
    </div>
  </main>

  <script src="assets/utils.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
