<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <title>Reset Password — Sigit TempMail</title>
  <link rel="icon" href="favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="flex flex-col min-h-screen">
  <div class="bg-mesh">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <header class="glass-nav">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl btn-primary flex items-center justify-center text-white">
          <i data-lucide="mail-check" class="w-5 h-5"></i>
        </div>
        <span class="font-extrabold text-lg text-slate-900">Sigit<span class="text-blue-600">TempMail</span></span>
      </a>
      <a href="login.html" class="text-xs sm:text-sm font-semibold text-slate-600 hover:text-blue-600">
        Batal & Login
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-md w-full space-y-6 animate-fade-in">
      <div class="w-14 h-14 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center mx-auto shadow-sm">
        <i data-lucide="lock-keyhole" class="w-7 h-7"></i>
      </div>

      <div class="space-y-1.5 text-center">
        <h1 class="text-2xl font-extrabold text-slate-900">Reset Password</h1>
        <p class="text-xs sm:text-sm text-slate-500">Kode OTP dikirim ke:</p>
        <p id="reset-email-display" class="text-sm font-bold text-blue-600 font-mono-code break-all">-</p>
      </div>

      <div id="auth-error-box" class="hidden p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium text-left"></div>
      <div id="auth-success-box" class="hidden p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium text-left"></div>

      <form id="reset-form" class="space-y-5 text-left" novalidate>
        <div>
          <label for="reset-otp" class="block text-xs font-semibold text-slate-600 mb-2">Kode OTP (6 digit)</label>
          <input
            type="text"
            id="reset-otp"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            placeholder="000000"
            required
            class="w-full py-3.5 px-4 text-center text-2xl font-extrabold tracking-[0.5em] font-mono-code rounded-2xl bg-white border-2 border-slate-200 focus:border-blue-600 focus:ring-4 focus:ring-blue-500/15 outline-none transition"
          />
        </div>

        <div>
          <label for="reset-new-password" class="block text-xs font-semibold text-slate-600 mb-2">Password Baru</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input
              type="password"
              id="reset-new-password"
              required
              placeholder="Min. 8 karakter (Huruf Besar, Kecil & Angka)"
              class="w-full pl-10 pr-10 py-3 rounded-xl bg-white border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 text-sm outline-none transition"
            />
            <button type="button" id="toggle-reset-pwd" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="grid grid-cols-2 gap-1.5 mt-2 text-[11px] text-slate-500">
            <div id="rchk-length" class="flex items-center gap-1"><span>○</span> Min. 8 karakter</div>
            <div id="rchk-upper" class="flex items-center gap-1"><span>○</span> Huruf besar (A-Z)</div>
            <div id="rchk-lower" class="flex items-center gap-1"><span>○</span> Huruf kecil (a-z)</div>
            <div id="rchk-number" class="flex items-center gap-1"><span>○</span> Angka (0-9)</div>
          </div>
        </div>

        <div class="flex items-center justify-center gap-2 text-xs text-slate-600 bg-slate-100/80 py-2 px-4 rounded-xl">
          <i data-lucide="clock" class="w-4 h-4 text-blue-600"></i>
          <span>Kode berlaku: <strong id="reset-countdown" class="font-mono-code text-slate-900">10:00</strong></span>
        </div>

        <button type="submit" id="btn-reset-submit" class="btn-primary w-full py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
          <i data-lucide="check-circle" class="w-4 h-4"></i>
          <span>Reset Password</span>
        </button>
      </form>

      <div class="pt-4 border-t border-slate-200/80 flex items-center justify-between text-xs">
        <span class="text-slate-500">Tidak menerima kode?</span>
        <a href="forgot-password.html" class="font-bold text-blue-600 hover:underline">Kirim Ulang</a>
      </div>
    </div>
  </main>

  <script src="assets/utils.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
